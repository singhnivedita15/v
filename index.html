<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Will you be my Valentine?</title>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 12px 0 18px;
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      user-select: none;
      transition: transform .12s ease, background .12s ease;
    }

    #yesBtn {
      left: 18%;
      background: var(--yes);
      color: #fff;
    }
    #yesBtn:hover { background: var(--yesHover); }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
      color: #111827;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .result {
      display: none;
      margin-top: 18px;
      animation: pop .35s ease;
    }

    @keyframes pop {
      from { transform: scale(.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .celebrate {
  animation: pop .4s ease, float 2s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

  </style>
</head>

<body>
  <canvas id="confettiCanvas"></canvas>

  <main class="card">
   <div id="bird">
  <!-- ANIMAL WITH HEART -->
  <svg class="art" viewBox="0 0 320 240" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="fur" x1="0" x2="1">
        <stop offset="0" stop-color="#f7c7a1"/>
        <stop offset="1" stop-color="#f2a97b"/>
      </linearGradient>
      <linearGradient id="heart" x1="0" x2="1">
        <stop offset="0" stop-color="#ff4d7d"/>
        <stop offset="1" stop-color="#ff1f68"/>
      </linearGradient>
    </defs>

    <path d="M250 50 C250 33 270 25 282 38
             C294 25 314 33 314 50
             C314 78 282 92 282 106
             C282 92 250 78 250 50Z"
          fill="url(#heart)"/>

    <path d="M90 120 C90 70 140 40 190 60
             C240 40 290 70 290 120
             C290 180 240 210 190 210
             C140 210 90 180 90 120Z"
          fill="url(#fur)"/>

    <path d="M110 92 L95 55 L140 78 Z" fill="#f2a97b"/>
    <path d="M270 92 L285 55 L240 78 Z" fill="#f2a97b"/>

    <circle cx="160" cy="130" r="8"/>
    <circle cx="220" cy="130" r="8"/>

    <path d="M190 144 C186 144 182 148 182 152
             C182 160 190 164 190 170
             C190 164 198 160 198 152
             C198 148 194 144 190 144Z"
          fill="#ff7aa2"/>
  </svg>
</div>

    <h1 id="question">mr boyfren will you be my valentine?</h1>
    
    <section class="button-zone" id="zone">
      <button id="yesBtn">Yes</button>
      <button id="noBtn">No</button>
    </section>

    <div class="hint" id="hint">“No” seems a bit shy </div>

    <section class="result" id="result">
      <h2>omg did u really say yes??</h2>
    </section>
  </main>

  <script>
    const zone = document.getElementById("zone");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const hint = document.getElementById("hint");
    const result = document.getElementById("result");
    const question = document.getElementById("question");

    const canvas = document.getElementById("confettiCanvas");

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = innerWidth * dpr;
      canvas.height = innerHeight * dpr;
    }
    resizeCanvas();
    addEventListener("resize", resizeCanvas);

    const confettiInstance = confetti.create(canvas, {
      resize: false,
      useWorker: true
    });

    let confettiInterval = null;

    
    let confettiLoop;
    function startConfettiLoop(){

  confettiLoop = setInterval(() => {
    confettiInstance({
      particleCount: 18,
      spread: 80,
      startVelocity: 30,
      ticks: 200,
      origin: {
        x: Math.random(),
        y: Math.random() * 0.4
      }
    });
  }, 400);
}

    {
      if (confettiInterval) return;

      confettiInterval = setInterval(() => {
        confettiInstance({
          particleCount: 40,
          spread: 100,
          startVelocity: 35,
          ticks: 200,
          origin: {
            x: Math.random(),
            y: Math.random() * 0.4
          }
        });
      }, 350);
    }

    function stopConfettiLoop() {
      clearInterval(confettiInterval);
      confettiInterval = null;
    }

    /* No button chaos */
    zone.addEventListener("pointermove", e => {
      const b = noBtn.getBoundingClientRect();
      const d = Math.hypot(
        b.left + b.width / 2 - e.clientX,
        b.top + b.height / 2 - e.clientY
      );
      if (d < 120) {
        noBtn.style.left = Math.random() * 70 + "%";
        noBtn.style.top = Math.random() * 70 + "%";
      }
    });

    noBtn.addEventListener("click", e => e.preventDefault());

    /* YES = FOREVER CONFETTI */
   const bird = document.getElementById("bird");

yesBtn.addEventListener("click", () => {
  zone.style.display = "none";
  hint.style.display = "none";
  question.style.display = "none";

  bird.classList.add("celebrate"); // ← bird lives, thrives, celebrates

  result.style.display = "block";
  resizeConfettiCanvas();
  fullScreenConfetti();
  startConfettiLoop();
});

  </script>
</body>
</html>
